version: '3.8'

services:
  # ── Databases ────────────────────────────────────────────────────────────────
  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - '5435:5432'
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-trip:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trip_db
    ports:
      - '5436:5432'
    volumes:
      - postgres-trip-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-delivery:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery_db
    ports:
      - '5437:5432'
    volumes:
      - postgres-delivery-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - '5438:5432'
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cache / Geo store ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Message broker ────────────────────────────────────────────────────────────
  # Single-node Kafka in KRaft mode (no Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - '9092:9092'     # external — local dev connects here
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # INTERNAL  — used by services inside the docker network
      # EXTERNAL  — advertised to the host machine
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qg=='
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 --request-timeout-ms 3000 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # ── Services ─────────────────────────────────────────────────────────────────
  user-service:
    build: ./user-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DB_HOST: postgres-user
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: user_db
      DB_SSL: 'false'
      JWT_SECRET: your-secret-key-change-in-production
    depends_on:
      postgres-user:
        condition: service_healthy

  trip-service:
    build: ./trip-service
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      DB_HOST: postgres-trip
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: trip_db
      DB_SSL: 'false'
      JWT_SECRET: your-secret-key-change-in-production
      KAFKA_BROKER: kafka:29092
      PRICING_SERVICE_URL: http://pricing-service:3003
      GEO_SERVICE_URL: http://geo-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
      MATCHING_SERVICE_URL: http://matching-service:3007
    depends_on:
      postgres-trip:
        condition: service_healthy

  pricing-service:
    build: ./pricing-service
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      MODEL_PATH: /app/models/moto_cost_model.pkl
    volumes:
      - ./ml-models:/app/models:ro

  geo-service:
    build: ./geo-service
    ports:
      - '3004:3004'
    environment:
      PORT: 3004
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      KAFKA_BROKER: kafka:29092
      USER_SERVICE_URL: http://user-service:3001
      # SMTP_HOST: smtp.example.com   # Uncomment for production email delivery
      # SMTP_PORT: 587
      # SMTP_USER: user@example.com
      # SMTP_PASS: secret
      # SMTP_FROM: noreply@courier.app
    depends_on:
      - kafka
      - user-service

  payment-service:
    build: ./payment-service
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      PORT: 3006
      DB_HOST: postgres-payment
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: payment_db
      DB_SSL: 'false'
    depends_on:
      postgres-payment:
        condition: service_healthy

  matching-service:
    build: ./matching-service
    restart: unless-stopped
    ports:
      - '3007:3007'
    environment:
      PORT: 3007
      KAFKA_BROKER: kafka:29092
      GEO_SERVICE_URL: http://geo-service:3004
      USER_SERVICE_URL: http://user-service:3001
    depends_on:
      - kafka

  rating-service:
    build: ./rating-service
    ports:
      - '3008:3008'
    environment:
      PORT: 3008

  routing-service:
    build: ./routing-service
    ports:
      - '3009:3009'
    environment:
      PORT: 3009

  delivery-service:
    build: ./delivery-service
    restart: unless-stopped
    ports:
      - '3010:3010'
    environment:
      PORT: 3010
      DB_HOST: postgres-delivery
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: delivery_db
      DB_SSL: 'false'
      JWT_SECRET: your-secret-key-change-in-production
      KAFKA_BROKER: kafka:29092
      USER_SERVICE_URL: http://user-service:3001
      TRIP_SERVICE_URL: http://trip-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
    depends_on:
      postgres-delivery:
        condition: service_healthy
    volumes:
      - delivery-uploads-data:/app/uploads

# ── Volumes & Network ─────────────────────────────────────────────────────────
volumes:
  postgres-user-data:
  postgres-trip-data:
  postgres-delivery-data:
  postgres-payment-data:
  delivery-uploads-data:

networks:
  default:
    name: courier-network
